name: vlanmesh

services:
  vlanmesh:
    build:
      context: .
      args:
        VERSION: ${VLANMESH_VERSION:-dev}
    image: vlanmesh:${VLANMESH_VERSION:-dev}
    container_name: vlanmesh
    # Impératif : le conteneur doit voir les pattes du LXC et poser son
    # policy routing dans le netns du LXC.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
