# À placer dans le LXC : /etc/sysctl.d/99-vlanmesh.conf
#
# La réponse d'un probe revient par l'interface du VLAN source alors que sa
# route inverse pointe vers l'interface du VLAN destination. rp_filter strict
# (1) la droppe. Le mode loose (2) accepte.
#
# Ajouter une ligne par patte data (eth1, eth2, ...).

net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
net.ipv4.conf.eth1.rp_filter=2
net.ipv4.conf.eth2.rp_filter=2
net.ipv4.conf.eth3.rp_filter=2
net.ipv4.conf.eth4.rp_filter=2
net.ipv4.conf.eth5.rp_filter=2
net.ipv4.conf.eth6.rp_filter=2
net.ipv4.conf.eth7.rp_filter=2
net.ipv4.conf.eth8.rp_filter=2
